<div class="min-h-screen bg-gray-50 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <span
                class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 tracking-tight">
                Trip Factory
            </span>
            <div class="flex items-center gap-4">
                <button
                    class="hidden sm:flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium shadow-sm active:scale-95 duration-150">
                    <lucide-icon [img]="Plus" class="w-4 h-4"></lucide-icon>
                    Nouveau Séjour
                </button>
                <div
                    class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold cursor-pointer hover:shadow-md transition-shadow">
                    J
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Mes Séjours</h1>
                <p class="text-gray-500 text-lg">Retrouvez tous vos voyages en cours et passés</p>
            </div>
            <button
                class="sm:hidden flex w-full justify-center items-center gap-2 px-4 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium shadow-sm">
                <lucide-icon [img]="Plus" class="w-4 h-4"></lucide-icon>
                Nouveau Séjour
            </button>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            @for (trip of trips; track trip.id) {
            <div (click)="openTrip(trip.id)"
                class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 cursor-pointer transform hover:-translate-y-1">
                <!-- Image -->
                <div class="h-48 overflow-hidden relative">
                    <div
                        class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors duration-300 z-10">
                    </div>
                    <img [src]="trip.image" [alt]="trip.name"
                        class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute top-4 right-4 z-20">
                        <span
                            class="bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-indigo-600 shadow-sm">
                            Organisateur
                        </span>
                    </div>
                </div>

                <!-- Content -->
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-xl font-bold text-gray-900 group-hover:text-indigo-600 transition-colors">
                            {{ trip.name }}
                        </h3>
                    </div>

                    <p class="text-gray-500 mb-6 line-clamp-2 h-12">{{ trip.description }}</p>

                    <div class="flex flex-col gap-3 border-t border-gray-50 pt-4">
                        <div class="flex items-center gap-3 text-sm text-gray-500">
                            <lucide-icon [img]="Calendar" class="w-4 h-4 text-indigo-500"></lucide-icon>
                            <span>{{ trip.dates }}</span>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-500">
                            <lucide-icon [img]="Users" class="w-4 h-4 text-purple-500"></lucide-icon>
                            <span>{{ trip.participants }} participants</span>
                        </div>
                    </div>
                </div>

                <!-- Footer Action -->
                <div
                    class="px-6 py-4 bg-gray-50 flex items-center justify-between group-hover:bg-indigo-50 transition-colors">
                    <span class="text-sm font-medium text-gray-600 group-hover:text-indigo-700">Gérer le séjour</span>
                    <lucide-icon [img]="ArrowRight"
                        class="w-4 h-4 text-gray-400 group-hover:text-indigo-600 transform group-hover:translate-x-1 transition-all"></lucide-icon>
                </div>
            </div>
            }

            <!-- Empty State / Add New Card (Optional) -->
            <button
                class="flex flex-col items-center justify-center h-full min-h-[400px] border-2 border-dashed border-gray-200 rounded-2xl hover:border-indigo-400 hover:bg-gray-50 transition-all duration-300 group">
                <div
                    class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-4 group-hover:bg-indigo-100 group-hover:text-indigo-600 transition-colors">
                    <lucide-icon [img]="Plus" class="w-8 h-8"></lucide-icon>
                </div>
                <span class="text-lg font-medium text-gray-500 group-hover:text-indigo-600">Créer un nouveau
                    séjour</span>
            </button>
        </div>
    </main>
</div>
